<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Jugadores — RAXON League</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo-text">RAXON</a>
        <nav class="nav">
            <a href="index.html">Inicio</a>
            <a href="jugadores.html" class="active">Jugadores</a>
        </nav>
    </header>

    <main class="section">
        <h2>DIRECTORIO OFICIAL DE JUGADORES</h2>
        <div id="players-grid" class="media-grid"></div>
    </main>

    <script src="js/supabase-client.js"></script>
    <script>
        async function loadPlayers() {
            const grid = document.getElementById('players-grid');
            const { data: players } = await supabase.from('players').select('nickname, avatar_url');
            
            if (!players || players.length === 0) {
                grid.innerHTML = '<p class="pending">No hay jugadores confirmados públicamente.</p>';
                return;
            }

            grid.innerHTML = players.map(p => `
                <div class="media-card alt-bg" style="padding: 1rem;">
                    <h4>${p.nickname}</h4>
                </div>
            `).join('');
        }
        loadPlayers();
    </script>
</body>
</html>
